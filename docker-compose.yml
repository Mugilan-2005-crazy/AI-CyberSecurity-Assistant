# ============================================================
# Docker Compose — Production Stack
# ============================================================
# Usage:
#   docker compose up -d          # start all services
#   docker compose down           # stop all services
#   docker compose down -v        # stop and remove volumes (WARNING: deletes data)
#   docker compose logs -f        # view logs
#   docker compose ps             # list running services
# ============================================================

services:
  # --------------------------------------------------------
  # MongoDB
  # --------------------------------------------------------
  mongodb:
    image: mongo:7
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: cybersec
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 256M
          cpus: '0.25'

  # --------------------------------------------------------
  # Redis Cache
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:-cybersphere-redis-secure-2024}"]
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # --------------------------------------------------------
  # Backend API
  # --------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api
      # MongoDB connection (Docker Compose internal DNS)
      MONGODB_URI: ${MONGODB_URI}
      # JWT secrets (set these via environment or .env file)
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRE: 15m
      JWT_REFRESH_EXPIRE: 30d
      # Encryption key for TOTP MFA (AES-256-GCM)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # CORS — HTTPS frontend origin
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      # Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      # AI providers
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_TIMEOUT: 30000
      # VirusTotal
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY}
      # Threat Intelligence Providers (Phase 2)
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY}
      OTX_API_KEY: ${OTX_API_KEY}
      NVD_API_KEY: ${NVD_API_KEY}
      THREAT_INTEL_CACHE_TTL: ${THREAT_INTEL_CACHE_TTL:-3600000}
      THREAT_INTEL_TIMEOUT: ${THREAT_INTEL_TIMEOUT:-15000}
      THREAT_INTEL_MAX_RETRIES: ${THREAT_INTEL_MAX_RETRIES:-3}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cybersphere-redis-secure-2024}
      # OpenTelemetry
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: cybersec-backend
      OTEL_PROMETHEUS_PORT: 9464
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Admin bootstrap
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cybersec.io}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Super Admin}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:5000/api/health | grep -q '\"success\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp
      - /app/uploads
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'

  # --------------------------------------------------------
  # Frontend (nginx serving built assets)
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --------------------------------------------------------
  # Caddy — HTTPS/TLS reverse proxy (production entry point)
  # --------------------------------------------------------
  caddy:
    image: caddy:2.8.4-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --------------------------------------------------------
  # MongoDB Exporter (Prometheus metrics for MongoDB)
  # --------------------------------------------------------
  mongodb-exporter:
    image: quay.io/prometheus/mongodb-exporter:0.23.0
    restart: always
    command:
      - "--mongodb.uri=mongodb://admin:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin"
      - "--web.listen-address=:9216"
    environment:
      - MONGODB_URI=mongodb://admin:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9216/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # --------------------------------------------------------
  # OpenTelemetry Collector — traces/metrics/telemetry hub
  # Receives OTLP from the backend (otel-collector:4318),
  # exposes self-metrics (:8889) + health (:13133).
  # Existing backend /api/observability/metrics scrape is unchanged.
  # --------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector:0.104.0
    restart: always
    command:
      - "--config=/etc/otel-collector.yaml"
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
      - otel_collector_data:/var/lib/otelcol
    networks:
      - app-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # NOTE: otel/opentelemetry-collector is a distroless image (no
    # wget/curl/sh), so an in-container HEALTHCHECK cannot probe the
    # HTTP endpoint. Liveness = process liveness (restart: always);
    # true readiness is exposed by the in-process health_check
    # extension on :13133 and verified externally below.

  # --------------------------------------------------------
  # Ollama (optional local AI)
  # --------------------------------------------------------
  ollama:
    image: ollama/ollama:0.3.38
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "ollama", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------
  # Prometheus
  # --------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --------------------------------------------------------
  # Grafana
  # --------------------------------------------------------
  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
      GF_SERVER_ROOT_URL: /grafana
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: false
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# --------------------------------------------------------
# Networks
# --------------------------------------------------------
networks:
  app-network:
    driver: bridge

# --------------------------------------------------------
# Volumes (persistent data)
# --------------------------------------------------------
volumes:
  mongodb_data:
    driver: local
  ollama_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  otel_collector_data:
    driver: local
