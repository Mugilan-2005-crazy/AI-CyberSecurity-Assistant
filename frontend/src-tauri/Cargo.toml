[package]
name = "enterprise-cyber-security-platform"
version = "2.1.0"
description = "Enterprise AI Cyber Security Platform — Desktop client"
authors = ["Mugilan"]
license = "MIT"
repository = "https://github.com/Mugilan-2005-crazy/AI-CyberSecurity-Assistant"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# This feature is used for production builds or when a dev server is not specified.
# NOTE: This feature flag is used for production builds or when `devPath` points to files.
custom-protocol = ["tauri/custom-protocol"]