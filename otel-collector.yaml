# ============================================================
# OpenTelemetry Collector configuration
# Receives OTLP (traces + metrics) from the application backend
# (env: OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318)
# and ships to:
#   - logging   (stdout, local dev)
#   - prometheus self-metrics endpoint on :8889
#
# IMPORTANT: the existing Prometheus scrape of the backend's
# own /api/observability/metrics endpoint is UNCHANGED — this
# collector is an additional observability sink (traces) and
# does not alter backend metrics exposure.
# ============================================================
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:
  logging:
    verbosity: normal
  prometheus:
    endpoint: "0.0.0.0:8889"

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"

service:
  extensions:
    - health_check
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, logging]
