---
# ============================================================
# ConfigMap — non-secret application configuration
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: cybersec-config
  namespace: cybersec-platform
  labels:
    app: cybersec-platform
data:
  NODE_ENV: "production"
  PORT: "5000"
  API_PREFIX: "/api"
  MONGO_INITDB_DATABASE: "cybersec"
  MONGODB_URI: "mongodb://mongo:27017/cybersec?authSource=admin"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_KEY_PREFIX: "csa:"
  OLLAMA_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.1"
  OLLAMA_TIMEOUT: "30000"
  THREAT_INTEL_CACHE_TTL: "3600000"
  THREAT_INTEL_TIMEOUT: "15000"
  THREAT_INTEL_MAX_RETRIES: "3"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "cybersec-backend"
  OTEL_PROMETHEUS_PORT: "9464"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
  ADMIN_EMAIL: "admin@cybersec.io"
  MAX_LOGIN_ATTEMPTS: "5"
  LOCKOUT_DURATION: "900000"
  CORS_ALLOWED_ORIGINS: "http://cybersec-platform.cybersec.io"
---
# ============================================================
# Secret — sensitive data (reference externalSecrets in production)
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: cybersec-secrets
  namespace: cybersec-platform
  labels:
    app: cybersec-platform
type: Opaque
stringData:
  JWT_SECRET: "change-me-to-a-long-random-string"
  JWT_REFRESH_SECRET: "change-me-to-a-long-random-string"
  JWT_EXPIRE: "15m"
  JWT_REFRESH_EXPIRE: "30d"
  ENCRYPTION_KEY: "change-me-to-a-32-char-encryption-key"
  ADMIN_PASSWORD: "change-me-to-a-secure-password"
  GEMINI_API_KEY: ""
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASS: ""
  EMAIL_FROM: "CyberSec <no-reply@cybersec.io>"
  VIRUSTOTAL_API_KEY: ""
  ABUSEIPDB_API_KEY: ""
  OTX_API_KEY: ""
  NVD_API_KEY: ""
