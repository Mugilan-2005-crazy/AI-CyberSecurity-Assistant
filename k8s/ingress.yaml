---
# ============================================================
# Ingress — TLS-secured external access to frontend/backend API
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cybersec-ingress
  namespace: cybersec-platform
  labels:
    app: cybersec-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/session-cookie-name: "csa-session"
    nginx.ingress.kubernetes.io/session-cookie-enabled: "true"
    nginx.ingress.kubernetes.io/session-cookie-expires: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
spec:
  tls:
    - hosts:
        - cybersec.io
        - www.cybersec.io
      secretName: cybersec-tls
  rules:
    - host: cybersec.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cybersec-backend-svc
                port:
                  name: http
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: cybersec-backend-svc
                port:
                  name: metrics
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cybersec-frontend-svc
                port:
                  name: http
    - host: www.cybersec.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cybersec-backend-svc
                port:
                  name: http
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: cybersec-backend-svc
                port:
                  name: metrics
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cybersec-frontend-svc
                port:
                  name: http
