---
# ============================================================
# Deployment — Backend API (rolling update, health probes, non-root)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybersec-backend
  namespace: cybersec-platform
  labels:
    app: cybersec-platform
    component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cybersec-platform
      component: backend
  template:
    metadata:
      labels:
        app: cybersec-platform
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      serviceAccountName: cybersec-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: csassistant-backend:3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
            - containerPort: 9464
              name: metrics
          envFrom:
            - configMapRef:
                name: cybersec-config
            - secretRef:
                name: cybersec-secrets
          env:
            - name: CLIENT_ORIGIN
              value: "http://cybersec-platform.cybersec.io"
            - name: REDIS_TLS
              value: "false"
            - name: REDIS_CONNECT_TIMEOUT_MS
              value: "5000"
            - name: REDIS_MAX_RETRIES
              value: "3"
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
       volumes:
        - name: uploads
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# ============================================================
# Deployment — Frontend (nginx serving built assets)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybersec-frontend
  namespace: cybersec-platform
  labels:
    app: cybersec-platform
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: cybersec-platform
      component: frontend
  template:
    metadata:
      labels:
        app: cybersec-platform
        component: frontend
    spec:
      serviceAccountName: cybersec-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: csassistant-frontend:3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
---
# ============================================================
# Deployment — Redis (in-cluster cache for distributed caching)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybersec-redis
  namespace: cybersec-platform
  labels:
    app: cybersec-platform
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cybersec-platform
      component: redis
  template:
    metadata:
      labels:
        app: cybersec-platform
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2.5-alpine3.20
          command:
            - redis-server
            - --appendonly yes
            - --maxmemory 512mb
            - --maxmemory-policy allkeys-lru
            - --requirepass $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cybersec-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
              name: redis
          livenessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
# ============================================================
# PersistentVolumeClaim — Redis data
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: cybersec-platform
  labels:
    app: cybersec-platform
    component: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# ============================================================
# Deployment — MongoDB (in-cluster database)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cybersec-mongodb
  namespace: cybersec-platform
  labels:
    app: cybersec-platform
    component: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cybersec-platform
      component: mongodb
  template:
    metadata:
      labels:
        app: cybersec-platform
        component: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0.14
          command:
            - mongod
            - --bind_ip_all
            - --auth
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "admin"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cybersec-secrets
                  key: MONGO_ROOT_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: "cybersec"
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc
---
# ============================================================
# PersistentVolumeClaim — MongoDB data
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: cybersec-platform
  labels:
    app: cybersec-platform
    component: mongodb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
